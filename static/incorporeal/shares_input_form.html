<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/homepage.css">
    <link rel="stylesheet" href="/styles/interactive.css">
    <link rel="stylesheet" href="/styles/property-cards.css">
    <title>Add Shares Declaration</title>
</head>
<body>
    <header class="top-header">
        <button id="collapseBtn" class="hamburger" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div class="header-user">
            <button id="signinBtn" class="user-btn" onclick="profileShowup()">👤</button>
            <div id="profileCard" class="profile-dropdown">
                <div class="profile-option">
                    <span class="profile-icon">👤</span>
                    <a href="#profile" class="profile-link">My Profile</a>
                </div>
                <div class="profile-option">
                    <span class="logout-icon">🚪</span>
                    <a href="#logout" class="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="welcome-section">
            <h1>Add <strong>Shares Declaration</strong></h1>
        </div>
        
        <div class="content-card">
            <h2>Shares in Society Declaration</h2>

            <form class="res-form">
                <!-- Company Name, Dividend/Occasional, Share amount -->
                <div class="form-group">
                    <label>Company Name *</label>
                    <input type="text" placeholder="Company">
                </div>

                <div class="form-group">
                    <label>Dividend/Occasional</label>
                    <input type="text" placeholder="Dividend">
                </div>

                <div class="form-group">
                    <label>Share amount *</label>
                    <input type="number" value="0.00">
                </div>

                <!-- TIN/Occasional, Location -->
                <div class="form-group">
                    <label>TIN/Occasional</label>
                    <input type="text" placeholder="TIN (Optional)">
                </div>

                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" placeholder="Location...">
                </div>

                <div class="form-bottom">
                    <button type="button" class="btn-secondary" onclick="goBack()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Declaration</button>
                </div>
                
                <div id="formMessage" class="form-message"></div>
            </form>
        </div>
    </main>
    
    <script src="/scripts/profilecard.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script src="/scripts/main.js"></script>
    <script>
        function goBack() {
            if (confirm('Are you sure you want to cancel? Any unsaved changes will be lost.')) {
                window.location.href = '/static/incorporeal/shares_add.html';
            }
        }
        
        document.querySelector('.res-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('formMessage');
            messageDiv.textContent = 'Saving declaration...';
            messageDiv.className = 'form-message info';
            
            setTimeout(() => {
                messageDiv.textContent = 'Declaration saved successfully!';
                messageDiv.className = 'form-message success';
                
                setTimeout(() => {
                    window.location.href = '/static/incorporeal/shares_add.html';
                }, 1500);
            }, 1000);
        });
    </script>
</body>
</html>
