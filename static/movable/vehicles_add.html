<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/styles/global.css">
     <link rel="stylesheet" href="/styles/sidebar.css">
     <link rel="stylesheet" href="/styles/homepage.css">
     <link rel="stylesheet" href="/styles/interactive.css">
     <link rel="stylesheet" href="/styles/property-cards.css">
     <title>Vehicles Declaration</title>
</head>
<body>
     <header class="top-header">
        <button id="collapseBtn" class="hamburger" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div class="header-user">
            <button id="signinBtn" class="user-btn" onclick="profileShowup()">👤</button>
            <div id="profileCard" class="profile-dropdown">
                <div class="profile-option">
                    <span class="profile-icon">👤</span>
                    <a href="#profile" class="profile-link">My Profile</a>
                </div>
                <div class="profile-option">
                    <span class="logout-icon">🚪</span>
                    <a href="#logout" class="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-container"></div>

     <main class="main-content">
          <div class="welcome-section">
               <h1>Vehicles <strong>Declarations</strong></h1>
               <div class="breadcrumb-nav"></div>
          </div>
          
          <div class="content-card">
               <div class="select_info">
                    <div class="declaration-header">
                         <h3>Your Vehicle Assets</h3>
                         <p id="record">No vehicles declared yet</p>
                    </div>
                    
                    <div class="declaration-controls">
                         <select title="declaration_period" name="declaration_period" class="period-select">
                              <option value="2024" selected>Declaration Period: 2024</option>
                              <option value="2023">Declaration Period: 2023</option>
                         </select>

                         <a href="/static/movable/vehicles_input_form.html">
                              <button type="button" class="btn-primary add-property-btn">
                                   <span class="icon">➕</span> Add Vehicle
                              </button>
                         </a>
                    </div>
               </div>
               
               <div class="properties-list" id="propertiesList">
                    <!-- Vehicles will be loaded here -->
               </div>
          </div>
     </main>
     
     <script src="/scripts/profilecard.js"></script>
     <script src="/scripts/sidebar.js"></script>
     <script src="/scripts/main.js"></script>
     <script>
          document.addEventListener('DOMContentLoaded', function() {
               loadSampleProperties();
          });
          
          function loadSampleProperties() {
               const propertiesList = document.getElementById('propertiesList');
               const record = document.getElementById('record');
               const properties = [];
               
               if (properties.length > 0) {
                    record.textContent = `${properties.length} vehicle(s) declared`;
                    propertiesList.innerHTML = properties.map(prop => `
                         <div class="property-card">
                              <div class="property-info">
                                   <h4>${prop.description}</h4>
                                   <p><strong>Owner:</strong> ${prop.owner}</p>
                                   <p><strong>Value:</strong> ${prop.value.toLocaleString()} RWF</p>
                                   <p><strong>Acquired:</strong> ${prop.dateAcquired}</p>
                                   <span class="status ${prop.status.toLowerCase()}">${prop.status}</span>
                              </div>
                              <div class="property-actions">
                                   <button class="btn-edit" onclick="editProperty(${prop.id})">Edit</button>
                                   <button class="btn-delete" onclick="deleteProperty(${prop.id})">Delete</button>
                              </div>
                         </div>
                    `).join('');
               }
          }
          
          function editProperty(id) {
               window.location.href = `/static/movable/vehicles_input_form.html?edit=${id}`;
          }
          
          function deleteProperty(id) {
               if (confirm('Are you sure you want to delete this vehicle?')) {
                    showToast('Vehicle deleted successfully');
                    loadSampleProperties();
               }
          }
          
          function showToast(message) {
               const toast = document.createElement('div');
               toast.className = 'toast';
               toast.textContent = message;
               document.body.appendChild(toast);
               
               setTimeout(() => toast.classList.add('visible'), 10);
               setTimeout(() => {
                    toast.classList.remove('visible');
                    setTimeout(() => toast.remove(), 300);
               }, 3000);
          }
     </script>
</body>
</html>
