<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/homepage.css">
    <link rel="stylesheet" href="/styles/interactive.css">
    <link rel="stylesheet" href="/styles/property-cards.css">
    <title>Sold Asset</title>
</head>
<body>
    <header class="top-header">
        <button id="collapseBtn" class="hamburger" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div class="header-user">
            <button id="signinBtn" class="user-btn" onclick="profileShowup()">👤</button>
            <div id="profileCard" class="profile-dropdown">
                <div class="profile-option">
                    <span class="profile-icon">👤</span>
                    <a href="#profile" class="profile-link">My Profile</a>
                </div>
                <div class="profile-option">
                    <span class="logout-icon">🚪</span>
                    <a href="#logout" class="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="welcome-section">
            <h1>Hi, <strong>ONESME Afurika!</strong></h1>
        </div>
        
        <div class="content-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <p style="color: #666; font-style: italic;">No records found.</p>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <select style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                        <option>View declaration period</option>
                    </select>
                    <button style="background: #6c5ce7; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer;">Add</button>
                </div>
            </div>
        </div>
    </main>
    
    <script src="/scripts/profilecard.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script src="/scripts/main.js"></script>
</body>
</html>
