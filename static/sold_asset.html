<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/homepage.css">
    <link rel="stylesheet" href="/styles/interactive.css">
    <link rel="stylesheet" href="/styles/property-cards.css">
    <title>Sold Asset</title>
</head>
<body>
    <header class="top-header">
        <button id="collapseBtn" class="hamburger" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div class="header-user">
            <button id="signinBtn" class="user-btn" onclick="profileShowup()">👤</button>
            <div id="profileCard" class="profile-dropdown">
                <div class="profile-option">
                    <span class="profile-icon">👤</span>
                    <a href="#profile" class="profile-link">My Profile</a>
                </div>
                <div class="profile-option">
                    <span class="logout-icon">🚪</span>
                    <a href="#logout" class="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="welcome-section">
            <h1>Hi, <strong>ONESME Afurika!</strong></h1>
        </div>
        
        <div class="content-card">
            <h2>Sold Asset Yearly Declaration</h2>

            <form class="res-form">
                <!-- Asset type, Location, Sale Amount -->
                <div class="form-group">
                    <label>Asset type *</label>
                    <input type="text" name="asset_type" placeholder="Asset type">
                </div>

                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" name="location" placeholder="Select Location...">
                </div>

                <div class="form-group">
                    <label>Sale Amount *</label>
                    <input type="number" name="sale_amount" value="0.00">
                </div>

                <div class="form-bottom">
                    <button type="submit" class="btn-primary">Submit</button>
                </div>
            </form>
        </div>
    </main>
    
    <script src="/scripts/validator.js"></script>
    <script src="/scripts/counter.js"></script>
    <script src="/scripts/profilecard.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script src="/scripts/main.js"></script>
    <script>
        document.querySelector('.res-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            const rules = {
                asset_type: [{type: 'required'}],
                location: [{type: 'required'}],
                sale_amount: [{type: 'required'}, {type: 'amount'}]
            };
            
            if (!Validator.validateForm(this, rules)) {
                return;
            }
            
            try {
                const response = await API.post('/api/assets/sold', data);
                if (response.success) {
                    alert('Sold asset saved successfully!');
                    this.reset();
                    updateAssetCounters();
                } else {
                    alert('Error saving sold asset: ' + (response.message || 'Unknown error'));
                }
            } catch (error) {
                alert('Connection error. Please try again.');
            }
        });
    </script>
</body>
</html>
