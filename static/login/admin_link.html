<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/sidebar.css">
    <link rel="stylesheet" href="/styles/homepage.css">
    <link rel="stylesheet" href="/styles/interactive.css">
    <link rel="stylesheet" href="/styles/property-cards.css">
    <title>Admin Link</title>
    <style>
        .admin-link:hover {
            color: #476aca !important;
        }
        .admin-link:hover div {
            color: #476aca !important;
        }
        
    </style>
</head>
<body>
    <header class="top-header">
        <button id="collapseBtn" class="hamburger" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
        </button>
        <div class="header-user">
            <button id="signinBtn" class="user-btn" onclick="profileShowup()">👤</button>
            <div id="profileCard" class="profile-dropdown">
                <div class="profile-option">
                    <span class="profile-icon">👤</span>
                    <a href="#profile" class="profile-link">My Profile</a>
                </div>
                <div class="profile-option">
                    <span class="logout-icon">🚪</span>
                    <a href="#logout" class="logout-link">Logout</a>
                </div>
            </div>
        </div>
    </header>

    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="welcome-section">
            <h1>Hi, <strong>ONESME Afurika!</strong></h1>
        </div>
        
        <div class="content-card">
            
            <div style="text-align: right; margin-bottom: 20px;">
                <select style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option>Select declaration period</option>
                </select>
            </div>

           
            <div style="background: #1761d0; color: white; text-align: center; padding: 10px; font-weight: bold; margin-bottom: 20px;">
                System Admin
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                
                <a href="/static/login/submitted_employees.html" class="admin-link" style="text-decoration: none; text-align: center; cursor: pointer;">
                    <div style="color: #666; margin-bottom: 5px;">Submitted Employees</div>
                    <div style="background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; display: inline-block;">0 OF 1461</div>
                </a>
                <a href="/static/login/declared_employees.html" class="admin-link" style="text-decoration: none; text-align: center; cursor: pointer;">
                    <div style="color: #666; margin-bottom: 5px;">Declared Process Employees</div>
                    <div style="background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; display: inline-block;">0 OF 1461</div>
                </a>

                <a href="/static/login/unregistered_employees.html" class="admin-link" style="text-decoration: none; text-align: center; cursor: pointer;">
                    <div style="color: #666; margin-bottom: 5px;">Unregistered employees</div>
                    <div style="background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; display: inline-block;">1461 OF 1461</div>
                </a>
                <a href="/static/login/unsubmitted_employees.html" class="admin-link" style="text-decoration: none; text-align: center; cursor: pointer;">
                    <div style="color: #666; margin-bottom: 5px;">Unsubmitted Employees</div>
                    <div style="background: #6c5ce7; color: white; padding: 5px 15px; border-radius: 15px; display: inline-block;">1461 OF 1461</div>
                </a>
            </div>

            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border-top: 1px solid #ddd; padding-top: 20px;">
                <a href="#individual-report" class="admin-link" style="text-decoration: none; text-align: center; color: #666; cursor: pointer;">Individual Report</a>
                <a href="/static/login/lock_user.html" class="admin-link" style="text-decoration: none; text-align: center; color: #666; cursor: pointer;">Lock User</a>
                <a href="#notification-deadline" class="admin-link" style="text-decoration: none; text-align: center; color: #666; cursor: pointer;">Notification deadline</a>
                <a href="#make-change" class="admin-link" style="text-decoration: none; text-align: center; color: #666; cursor: pointer;">Make Change</a>
            </div>
        </div>
    </main>
    
    <script src="/scripts/profilecard.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <script src="/scripts/main.js"></script>
    <script src="/scripts/profilecard.js" defer></script>
</body>
</html>
