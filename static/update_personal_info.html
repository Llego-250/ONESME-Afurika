<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/updating_personal_info.css">
    <title>Updating Personal Info</title>
  </head>
  <body>



   <!-- aside -->













    <main class="" id="">
      <div class="container">
        <h2>Personal Information</h2>

        <form class="info-form">
          <div class="form-group">
            <label>Profession *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" value="1986-01-01" />
          </div>

          <div class="form-group">
            <label>Place of Birth *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Status *</label>
            <select>
              <option>Please select</option>
            </select>
          </div>

          <div class="form-group">
            <label>Job Title *</label>
            <input type="text" value="TAX OFFICER" />
          </div>

          <div class="form-group">
            <label>Nationality *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Department *</label>
            <select>
              <option>Small and Medium Taxpayers</option>
            </select>
          </div>

          <div class="form-group">
            <label>Office Telephone *</label>
            <input type="text" />
          </div>

          <!-- RIGHT SIDE -->

          <div class="form-group">
            <label>Mobile Telephone *</label>
            <input type="text" value="0784210912" />
          </div>

          <div class="form-group">
            <label>Place of Work *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Job Category *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Initial Grade *</label>
            <input type="text" />
          </div>

          <div class="form-group">
            <label>Current Grade *</label>
            <input type="number" value="4" />
          </div>

          <div class="form-group">
            <label>Email *</label>
            <input type="email" value="jadelieu.nemeyingabo@rra.gov.rw" />
          </div>

          <div class="form-bottom">
            <button type="submit" class="btn">Update</button>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
