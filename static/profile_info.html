    <div id="sidebar-container"></div>
     
     <header class="profil-header">
          <div class="profile-breadcrumb">
               <span>Hi, <strong>ONESME Africa</strong>!</span>
               <nav class="breadcrumb-nav">
                    <a href="#">Dashboard</a>
                    <span class="breadcrumb-separator">/</span>

               </nav>
          </div>

     <main class="profile-container">
          <!-- Profile Card -->
          <div class="profile-card">
               <div class="profile-left">
                    <div class="profile-avatar">👤</div>
               </div>

               <div class="profile-right">
                    <!-- Name & Position -->
                    <section class="profile-section profile-header-section">
                         <h1 class="profile-name">Onesme Africa</h1>
                         <p class="profile-position">Tax OFFICER</p>
                    </section>

                    <!-- Profile Details -->
                    <section class="profile-section">
                         <div class="profile-grid">
                              <div class="profile-item">
                                   <label class="profile-label">Email</label>
                                   <p class="profile-value">onesme@ma.gov.rw</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Status</label>
                                   <p class="profile-value">Active</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Nationality</label>
                                   <p class="profile-value">Rwandan</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Date of Birth</label>
                                   <p class="profile-value">1986-01-01</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Place of Birth</label>
                                   <p class="profile-value">Rwanda</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Office Telephone</label>
                                   <!-- <p class="profile-value">$phone.value</p> -->
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Mobile Telephone</label>
                                   <p class="profile-value">+250 78 427 972</p>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Place of Work :</label>
                                                                  </div>

                              <div class="profile-item">
                                   <label class="profile-label">Job Category :</label>
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Initial Grade :</label>
                                   
                              </div>

                              <div class="profile-item">
                                   <label class="profile-label">Current Grade</label>
                                   <p class="profile-value">Grade 4</p>
                              </div>
                         </div>
                    </section>

                    <!-- Action Buttons -->
                    <section class="profile-actions">
                         <button class="btn-primary" onclick="navigateToPage('update_personal_info.html')">Update Profile</button>
                         <button class="btn-secondary" onclick="navigateToPage('index.html')">Back to Dashboard</button>

          </div>

     <script src="../scripts/profilecard.js"></script>
     <script src="../scripts/sidebar.js"></script>
     <script src="../scripts/main.js"></script>
     <script>
          // Add profile interactivity
          document.addEventListener('DOMContentLoaded', function() {
               // Animate profile card on load
               const profileCard = document.querySelector('.profile-card');
               if (profileCard) {
                    profileCard.style.opacity = '0';
                    profileCard.style.transform = 'translateY(20px)';
                    
                    setTimeout(() => {
                         profileCard.style.transition = 'all 0.6s ease';
                         profileCard.style.opacity = '1';
                         profileCard.style.transform = 'translateY(0)';
                    }, 100);
               }
               
               // Add hover effects to profile items
               const profileItems = document.querySelectorAll('.profile-item');
               profileItems.forEach(item => {
                    item.addEventListener('mouseenter', function() {
                         this.style.background = '#f8f9fa';
                         this.style.borderRadius = '6px';
                         this.style.padding = '8px';
                         this.style.margin = '-8px';
                         this.style.transition = 'all 0.2s ease';
                    });
                    
                    item.addEventListener('mouseleave', function() {
                         this.style.background = '';
                         this.style.borderRadius = '';
                         this.style.padding = '';
                         this.style.margin = '';
                    });
               });
          });
          
          function navigateToPage(page) {
               window.location.href = `/static/${page}`;
          }
     </script>
